name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - "aurum-be/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# One deploy at a time, and a queued deploy waits instead of cancelling the one
# in flight: cancelling mid-`up` would leave the host half-rolled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Main-only guard
    runs-on: ubuntu-latest
    steps:
      # `workflow_dispatch` can target any branch, so the ref is checked here
      # instead of trusting the trigger.
      - name: Refuse any ref other than main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy may run only from refs/heads/main, got ${GITHUB_REF}"
            exit 1
          fi

  build-and-deploy:
    name: Build and deploy
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/aurum-be" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=ghcr.io/${owner}/aurum-be:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what a human pulls; the SHA tag is the rollback target and
      # the one the host actually runs.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./aurum-be
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # The fingerprint is the public RSA host key, not a secret: the Go SSH
      # client prefers rsa-sha2-*, so the RSA key is the one it verifies.
      # Re-derive before changing: ssh-keyscan -t rsa <host> | ssh-keygen -lf -
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          fingerprint: SHA256:VJhnXvd0pZ6gY7SIlJRZVUYCPmGXZjQ5z7h6hcHp4ew
          source: docker-compose.prod.yml
          target: /opt/aurum

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          DEPLOYED_IMAGE: ${{ env.GHCR_IMAGE }}
          MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
          MCP_AUDIENCE: ${{ vars.MCP_AUDIENCE }}
          MCP_READ_SCOPES: ${{ vars.MCP_READ_SCOPES }}
          MCP_WRITE_SCOPES: ${{ vars.MCP_WRITE_SCOPES }}
          MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          fingerprint: SHA256:VJhnXvd0pZ6gY7SIlJRZVUYCPmGXZjQ5z7h6hcHp4ew
          envs: GHCR_TOKEN,GITHUB_OWNER,DEPLOYED_IMAGE,MCP_RESOURCE_URL,MCP_AUDIENCE,MCP_READ_SCOPES,MCP_WRITE_SCOPES,MCP_ALLOWED_ORIGINS
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$(echo $GITHUB_OWNER | tr '[:upper:]' '[:lower:]')" --password-stdin
            cd /opt/aurum
            case "$MCP_RESOURCE_URL" in
              https://*/mcp) ;;
              *)
                echo "MCP_RESOURCE_URL must be an https URL ending in /mcp; refusing to deploy"
                exit 1
                ;;
            esac
            sed -i '/^GHCR_IMAGE=/d; /^MCP_RESOURCE_URL=/d; /^MCP_AUDIENCE=/d; /^MCP_READ_SCOPES=/d; /^MCP_WRITE_SCOPES=/d; /^MCP_ALLOWED_ORIGINS=/d; /^MCP_AUTH0_CLIENT_ID=/d' .env
            {
              printf 'GHCR_IMAGE=%s\n' "$DEPLOYED_IMAGE"
              printf 'MCP_RESOURCE_URL=%s\n' "$MCP_RESOURCE_URL"
              printf 'MCP_AUDIENCE=%s\n' "$MCP_AUDIENCE"
              printf 'MCP_READ_SCOPES=%s\n' "$MCP_READ_SCOPES"
              printf 'MCP_WRITE_SCOPES=%s\n' "$MCP_WRITE_SCOPES"
              printf 'MCP_ALLOWED_ORIGINS=%s\n' "$MCP_ALLOWED_ORIGINS"
            } >> .env
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
            curl -fsS --retry 12 --retry-delay 5 --retry-connrefused --max-time 10 http://127.0.0.1:8080/actuator/health
            # Dangling layers older than two weeks only: the previous SHA tag is
            # the rollback target and must survive the deploy that replaces it.
            docker image prune -f --filter "until=336h"
