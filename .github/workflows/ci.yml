name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests
        working-directory: aurum-be
        run: ./mvnw test -Dtest="!AurumApplicationTests" --no-transfer-progress

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: aurum-be/target/site/jacoco
          retention-days: 7

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aurum-fe/package-lock.json

      - name: Install dependencies
        working-directory: aurum-fe
        run: npm ci

      - name: Lint
        working-directory: aurum-fe
        run: npm run lint

      - name: Typecheck
        working-directory: aurum-fe
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: aurum-fe
        run: npm test -- --run --coverage

      - name: Build
        working-directory: aurum-fe
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: aurum-fe/coverage
          retention-days: 7

  test-frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aurum-fe/package-lock.json

      - name: Install dependencies
        working-directory: aurum-fe
        run: npm ci

      - name: Install Playwright browsers
        working-directory: aurum-fe
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: aurum-fe
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: aurum-fe/playwright-report
          retention-days: 7

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The hash is pinned here rather than read from the release's own
      # checksums file: whoever could swap the tarball could swap that file too.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: Scan every commit
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="--all"
