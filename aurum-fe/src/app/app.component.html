<p-toast />
<p-confirmdialog />
<app-gdpr-consent />

<!-- Dot grid pattern -->
<div
	class="pointer-events-none fixed inset-0 -z-20on bg-[radial-gradient(circle,rgba(0,0,0,0.1)_1px,transparent_1px)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.07)_1px,transparent_1px)] bg-size-[22px_22px]"
></div>

<main class="flex flex-col w-screen h-screen box-border">
	<div
		#navbar
		class="fixed z-10 w-full max-sm:bottom-0 max-sm:pt-3 sm:top-0 sm:pb-3"
	>
		@if (isAuthenticated()) {
			<p-toolbar
				class="rounded-none! bg-white/30! border-gray-300/30! shadow-sm! dark:bg-zinc-900/40! dark:border-zinc-800/70! dark:shadow-2xl! backdrop-blur-md!"
			>
				<ng-template #start>
					<div class="flex items-center gap-1 mr-3 px-2 py-3">
						<img
							src="favicon.svg"
							alt="Aurum Logo"
							class="w-8 h-8 mr-2"
						/>
						<span class="max-sm:hidden text-xl font-bold font-mono">Aurum</span>
					</div>

					@for (path of paths; track path[0]) {
						<a
							[routerLink]="path[0]"
							routerLinkActive="text-primary! font-extrabold"
							[routerLinkActiveOptions]="{ exact: true }"
							severity="secondary"
							[text]="true"
							[class.mr-3]="!$last"
							pButton
						>
							<span class="flex items-center gap-2">
								<i [class]="path[1].icon"></i>
								<span class="max-md:hidden">{{ path[1].label }}</span>
							</span>
						</a>
					}
				</ng-template>

				<ng-template #end>
					<p-button
						#profileButton
						severity="secondary"
						[text]="true"
						size="small"
						(onClick)="profileMenu.toggle($event)"
					>
						<div class="flex flex-col items-end max-sm:hidden">
							<span class="text-primary text-sm font-bold">
								{{ isPrivacyMode() ? "••••••••" : user()?.name }}
							</span>
							<span class="text-xs">
								{{ isPrivacyMode() ? "••••••••••••••••••••••••" : user()?.email }}
							</span>
						</div>
						@if (avatarUrl() && !isPrivacyMode()) {
							<p-avatar
								[image]="avatarUrl()"
								shape="circle"
							/>
						} @else {
							<p-avatar
								[icon]="isPrivacyMode() ? 'pi pi-eye-slash' : 'pi pi-user'"
								class="bg-surface-200! dark:bg-surface-700!"
								shape="circle"
							/>
						}
						<i class="pi pi-chevron-up sm:hidden! ml-2"></i>
						<i class="pi pi-chevron-down max-sm:hidden! ml-2"></i>
					</p-button>

					<p-menu
						#profileMenu
						[popup]="true"
						[model]="profileMenuItems()"
						[appendTo]="profileButton"
						styleClass="left-auto! right-2! max-sm:top-auto! max-sm:bottom-[64px]! sm:top-[64px]!"
					/>
				</ng-template>
			</p-toolbar>
		}
	</div>
	<section
		class="w-full px-3 max-sm:pt-3! sm:pb-3!"
		[style.padding-top.px]="navbar.offsetHeight"
		[style.padding-bottom.px]="navbar.offsetHeight"
	>
		<router-outlet />
	</section>
</main>
