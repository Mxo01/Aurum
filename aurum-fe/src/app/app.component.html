<p-toast />
<p-confirmdialog />
<app-gdpr-consent />

<main class="flex flex-col w-screen h-screen box-border">
	<div
		#navbar
		class="fixed z-10 pb-3 w-full"
	>
		<p-toolbar
			class="rounded-none! bg-white/30! border-gray-300/30! shadow-sm! dark:bg-zinc-900/40! dark:border-zinc-800/70! dark:shadow-2xl! backdrop-blur-md!"
		>
			<ng-template #start>
				<div class="flex items-center gap-1 mr-3 px-2 py-3">
					<img
						src="favicon.svg"
						alt="Aurum Logo"
						class="w-8 h-8 mr-2"
					/>
					<span class="max-sm:hidden text-xl font-bold font-mono">Aurum</span>
				</div>

				@for (path of paths; track path[0]) {
					<a
						[routerLink]="path[0]"
						routerLinkActive="text-primary! font-extrabold"
						[routerLinkActiveOptions]="{ exact: true }"
						severity="secondary"
						[text]="true"
						[class.mr-3]="!$last"
						pButton
					>
						<span class="flex items-center gap-2">
							<i [class]="path[1].icon"></i>
							<span class="max-sm:hidden">{{ path[1].label }}</span>
						</span>
					</a>
				}
			</ng-template>

			<ng-template #end>
				<p-button
					severity="secondary"
					[text]="true"
					size="small"
					routerLink="/profile"
				>
					<div class="flex flex-col items-end max-sm:hidden">
						<span class="text-primary text-sm font-bold">{{ user()?.name }}</span>
						<span class="text-xs">{{ user()?.email }}</span>
					</div>
					@if (avatarUrl()) {
						<p-avatar
							[image]="avatarUrl()"
							shape="circle"
						/>
					} @else {
						<p-avatar
							icon="pi pi-user"
							class="bg-surface-200! dark:bg-surface-700!"
							shape="circle"
						/>
					}
				</p-button>

				<p-button
					severity="danger"
					icon="pi pi-sign-out"
					[rounded]="true"
					[text]="true"
					size="small"
					(onClick)="logout()"
				/>
			</ng-template>
		</p-toolbar>
	</div>
	<section
		class="w-full px-3 pb-3"
		[style.margin-top.px]="navbar.offsetHeight"
	>
		<router-outlet />
	</section>
</main>
