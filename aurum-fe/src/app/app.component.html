<p-toast />
<p-confirmdialog />

<main class="flex flex-col w-screen h-screen">
	<p-toolbar class="rounded-none!">
		<ng-template #start>
			@for (path of paths; track path[0]) {
				<a
					[routerLink]="path[0]"
					routerLinkActive="text-primary! font-extrabold"
					[routerLinkActiveOptions]="{ exact: true }"
					severity="secondary"
					[text]="true"
					class="mr-3"
					pButton
				>
					<span class="flex items-center gap-2">
						<i [class]="path[1].icon"></i>
						<span class="max-sm:hidden">{{ path[1].label }}</span>
					</span>
				</a>
			}
		</ng-template>
		<ng-template #end>
			<p-button
				severity="secondary"
				[text]="true"
				routerLink="/profile"
			>
				<div class="flex flex-col items-end max-sm:hidden">
					<span class="text-primary text-sm font-bold">{{ user()?.name }}</span>
					<span class="text-xs">{{ user()?.email }}</span>
				</div>
				<p-avatar
					[image]="user()?.picture"
					shape="circle"
				/>
			</p-button>

			<p-button
				severity="danger"
				icon="pi pi-sign-out"
				[rounded]="true"
				[text]="true"
				(onClick)="logout()"
			/>
		</ng-template>
	</p-toolbar>
	<section class="w-full h-full p-3">
		<router-outlet />
	</section>
</main>
