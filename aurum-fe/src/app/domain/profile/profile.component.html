<section class="flex flex-col gap-5 max-w-4xl mx-auto">
	<p-button
		[label]="'Back to ' + paths[previousRoute].label"
		[routerLink]="previousRoute"
		icon="pi pi-arrow-left"
		[text]="true"
		severity="secondary"
		size="small"
	/>

	<p-card>
		<div class="flex flex-col gap-3">
			<span class="flex items-center gap-2 font-bold">
				<i class="pi pi-user font-bold!"></i>
				Personal Details
			</span>

			<div class="flex flex-col gap-2">
				<label for="username">Name</label>
				<p-iconfield>
					<input
						pInputText
						id="username"
						autocomplete="off"
						[fluid]="true"
						[ngModel]="user()?.name"
						(ngModelChange)="updateName($event)"
						size="small"
					/>
					@if (isUpdatingName()) {
						<p-inputicon class="pi pi-spinner pi-spin" />
					}
				</p-iconfield>
			</div>
		</div>
	</p-card>

	<p-card>
		<div class="flex flex-col gap-4">
			<span class="flex items-center gap-2 font-bold">
				<i class="pi pi-cog font-bold!"></i>
				Preferences
			</span>

			<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
				<div class="flex flex-col">
					<span>Currency</span>
					<span class="text-xs text-gray-500">Change your display currency</span>
				</div>
				<p-select-button
					[ngModel]="currency()"
					(onChange)="chooseCurrency($event)"
					[options]="currencyOptions()"
					size="small"
				>
					<ng-template
						#item
						let-item
					>
						<div class="flex items-center gap-2">
							<i [class]="item.icon"></i>
							<span>{{ item.label }}</span>
						</div>
					</ng-template>
				</p-select-button>
			</div>

			<p-divider />

			<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
				<div class="flex flex-col">
					<span>Theme</span>
					<span class="text-xs text-gray-500">Change your display theme</span>
				</div>
				<p-select-button
					[ngModel]="theme()"
					(onChange)="toggleTheme()"
					[options]="themeOptions()"
					size="small"
				>
					<ng-template
						#item
						let-item
					>
						<div class="flex items-center gap-2">
							<i [class]="item.icon"></i>
							<span>{{ item.label }}</span>
						</div>
					</ng-template>
				</p-select-button>
			</div>
		</div>
	</p-card>

	<p-card class="bg-red-950! border-red-900! border-2 text-red-200!">
		<div class="flex flex-col gap-5">
			<span class="flex items-center gap-2 font-bold">
				<i class="pi pi-exclamation-triangle font-bold!"></i>
				Danger Zone
			</span>

			<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
				<div class="flex flex-col">
					<span>Delete Account</span>
					<span class="text-xs text-red-200">
						The user will be removed and you will no longer have access to this application unless
						you re-register.
					</span>
				</div>
				<p-button
					label="Delete"
					severity="danger"
					size="small"
					class="sm:shrink-0"
					(onClick)="deleteProfile($event)"
				/>
			</div>
		</div>
	</p-card>
</section>
