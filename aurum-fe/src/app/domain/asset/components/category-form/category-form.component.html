<p-dialog
	[header]="selectedCategory() ? 'Edit Category' : 'New Category'"
	[(visible)]="isVisible"
	[modal]="true"
	[style]="{ width: '360px' }"
	(onHide)="onDialogHide()"
>
	<ng-template #content>
		<form
			[formGroup]="categoryForm"
			class="flex flex-col gap-5 pt-2"
		>
			<div class="flex flex-col gap-2">
				<label for="category-name">Name *</label>
				<input
					id="category-name"
					pInputText
					formControlName="name"
					pSize="small"
					placeholder="e.g. Stocks"
				/>
				@if (categoryForm.controls.name.invalid && categoryForm.controls.name.touched) {
					<small class="text-red-500 text-xs">Name is required</small>
				}
			</div>
			<div class="flex flex-col gap-2">
				<label for="category-type">Type *</label>
				<p-select
					id="category-type"
					formControlName="type"
					[options]="typeOptions()"
					placeholder="Select type"
					size="small"
					appendTo="body"
				/>
				@if (categoryForm.controls.type.invalid && categoryForm.controls.type.touched) {
					<small class="text-red-500 text-xs">Type is required</small>
				}
			</div>
		</form>
	</ng-template>

	<ng-template #footer>
		<div class="flex gap-2 justify-end">
			@if (selectedCategory()) {
				<p-button
					label="Delete"
					severity="danger"
					icon="pi pi-trash"
					[loading]="isDeleteLoading()"
					size="small"
					(onClick)="deleteCategory($event)"
				/>
			}
			<p-button
				[label]="selectedCategory() ? 'Update' : 'Add'"
				[disabled]="categoryForm.invalid"
				[loading]="isSaveLoading()"
				size="small"
				(onClick)="saveCategory()"
			/>
		</div>
	</ng-template>
</p-dialog>
