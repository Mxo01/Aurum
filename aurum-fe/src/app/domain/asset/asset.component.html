<section class="flex flex-col gap-3 max-w-6xl mx-auto">
	<div class="flex flex-wrap items-center justify-between gap-3">
		<p-button
			[label]="'Back to ' + paths[previousRoute].label"
			[routerLink]="previousRoute"
			icon="pi pi-arrow-left"
			[text]="true"
			severity="secondary"
			size="small"
		/>

		<div class="flex gap-3">
			<p-button
				label="Edit Categories"
				icon="pi pi-pencil"
				severity="secondary"
				routerLink="/assets/categories"
				size="small"
			/>

			<p-button
				label="Add Asset"
				icon="pi pi-plus"
				(onClick)="isDrawerVisible.set(true)"
				size="small"
			/>
		</div>
	</div>

	<app-asset-table
		[assets]="assets()"
		[isLoading]="areAssetsLoading()"
		[currency]="userCurrency()"
		[locale]="userLocale()"
		(viewHistory)="viewHistory($event)"
		(editAsset)="editAsset($event)"
		(toggleAssetStatus)="toggleAssetStatus($event)"
		(deleteAsset)="deleteAsset($event)"
	/>
</section>

<app-asset-form
	[(isVisible)]="isDrawerVisible"
	[(selectedAsset)]="selectedAsset"
	[categoriesOptions]="categoriesOptions()"
	[locale]="userLocale()"
	(save)="saveAssetAndSnapshot($event)"
/>

<app-asset-history
	[(isVisible)]="isHistoryDialogVisible"
	[(selectedAsset)]="selectedAsset"
	[locale]="userLocale()"
	(snapshotsChanged)="refreshAssets()"
/>

<p-dialog
	[header]="pendingStatusToggle()?.newStatus ? 'Activate Asset' : 'Archive Asset'"
	[visible]="isStatusDialogVisible()"
	(visibleChange)="isStatusDialogVisible.set($event)"
	[modal]="true"
	[style]="{ width: '24rem' }"
	(onHide)="cancelStatusToggle()"
>
	<div class="flex flex-col gap-4">
		<p class="text-sm text-color-secondary m-0">
			{{
				pendingStatusToggle()?.newStatus
					? "From what date should this asset be activated?"
					: "From what date should this asset be archived?"
			}}
		</p>
		<p-datepicker
			[(ngModel)]="statusChangeDate"
			[showIcon]="true"
			dateFormat="dd/mm/yy"
			[maxDate]="$any(null)"
			placeholder="Select date"
			styleClass="w-full"
		/>
	</div>
	<ng-template #footer>
		<p-button
			label="Cancel"
			severity="secondary"
			[text]="true"
			(onClick)="cancelStatusToggle()"
		/>
		<p-button
			[label]="pendingStatusToggle()?.newStatus ? 'Activate' : 'Archive'"
			[severity]="pendingStatusToggle()?.newStatus ? 'success' : 'warn'"
			(onClick)="confirmStatusToggle()"
			[loading]="isSaveLoading()"
		/>
	</ng-template>
</p-dialog>
