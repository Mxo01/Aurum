<p-dialog
	header="All Financial Targets"
	[(visible)]="isVisible"
	[modal]="true"
	[draggable]="false"
	[style]="{ width: '70vw' }"
	[breakpoints]="{ '960px': '85vw', '640px': '95vw' }"
>
	<p-table
		[value]="targets()"
		[stripedRows]="true"
		[paginator]="true"
		[rows]="10"
		size="small"
	>
		<ng-template #header>
			<tr>
				<th>Name</th>
				<th class="text-right">Target</th>
				<th class="text-right">Current</th>
				<th class="text-center">Progress</th>
				<th class="text-center">Deadline</th>
				<th class="text-center">Status</th>
				<th class="text-center">Actions</th>
			</tr>
		</ng-template>
		<ng-template
			#body
			let-target
		>
			<tr>
				<td class="font-medium">{{ target.name }}</td>
				<td class="text-right font-mono">
					{{ target.targetAmount | currency: currency() : "symbol" : "1.2-2" : locale() }}
				</td>
				<td class="text-right font-mono">
					{{ target.currentAmount | currency: currency() : "symbol" : "1.2-2" : locale() }}
				</td>
				<td class="text-center">
					<p-progressbar [value]="target.completionPercentage | number: '1.0-0'" />
				</td>
				<td class="text-center whitespace-nowrap">
					{{ target.deadline | date: "mediumDate" }}
				</td>
				<td class="text-center">
					<p-tag
						class="whitespace-nowrap"
						[value]="statusLabel(target.status)"
						[severity]="statusSeverity(target.status)"
					/>
				</td>
				<td class="text-center">
					<div class="flex justify-center gap-2">
						<p-button
							icon="pi pi-pencil"
							[rounded]="true"
							[text]="true"
							severity="secondary"
							size="small"
							(onClick)="edit.emit(target)"
						/>
						<p-button
							icon="pi pi-trash"
							[rounded]="true"
							[text]="true"
							severity="danger"
							size="small"
							(onClick)="delete.emit(target.id)"
						/>
					</div>
				</td>
			</tr>
		</ng-template>
		<ng-template #emptymessage>
			<tr>
				<td
					colspan="7"
					class="text-center py-12!"
				>
					<div class="flex flex-col items-center gap-4 text-stone-400">
						<i class="pi pi-inbox text-4xl!"></i>
						<p>No targets found.</p>
					</div>
				</td>
			</tr>
		</ng-template>
	</p-table>
</p-dialog>
