<section class="flex flex-col gap-4">
	<div class="grid grid-cols-12 gap-4">
		<div class="col-span-12 sm:col-span-6 lg:col-span-3">
			<app-kpi-card
				label="Total Liabilities"
				[value]="
					(totalLiabilities() | currency: userCurrency() : 'symbol' : '1.2-2' : userLocale()) || 0
				"
				[invertVariation]="true"
				[sparklineData]="liabilitiesSparkline()"
			/>
		</div>
	</div>

	<div class="grid grid-cols-12 gap-4 h-125 sm:h-none!">
		<div class="col-span-12">
			<app-networth-chart
				[data]="chartData()"
				[summary]="summary()"
				[currency]="userCurrency()"
				[locale]="userLocale()"
				(yearChanged)="onYearChanged($event)"
			/>
		</div>
	</div>

	<div class="grid grid-cols-12 gap-4">
		<div class="col-span-12 lg:col-span-3">
			<app-target-widget
				[targets]="targets()"
				[currency]="userCurrency()"
				[locale]="userLocale()"
			/>
		</div>

		<div class="col-span-12 lg:col-span-9">
			<app-top-assets
				[summary]="summary()"
				[assets]="topAssets()"
				[locale]="userLocale()"
				(viewMore)="navigateToAssets()"
			/>
		</div>
	</div>
</section>
