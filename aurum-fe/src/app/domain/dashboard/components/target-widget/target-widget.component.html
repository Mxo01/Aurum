<p-card class="rounded-xl h-full flex flex-col">
	<div class="flex flex-col h-full p-6">
		<div class="w-full flex justify-between items-center mb-4">
			<span class="text-xl font-bold flex items-center gap-3">
				<i class="pi pi-gauge text-xl! font-bold"></i>
				Financial Target
			</span>
			@if (target()) {
				<p-button
					icon="pi pi-pencil"
					size="small"
					severity="secondary"
					label="Edit Target"
					(onClick)="updateTarget.emit()"
				/>
			} @else {
				<p-button
					label="Set Target"
					severity="secondary"
					size="small"
					(onClick)="updateTarget.emit()"
				/>
			}
		</div>

		<div class="grow flex flex-col items-center justify-center">
			@if (target()) {
				<div class="flex flex-col items-center gap-4">
					<p-knob
						[ngModel]="target()!.completionPercentage"
						[readonly]="true"
						valueTemplate="{value}%"
						[size]="150"
						valueColor="#42A5F5"
						rangeColor="var(--p-surface-200)"
					/>

					<div class="text-center">
						<div class="text-2xl font-bold mb-1">{{ target()!.name }}</div>
						<div class="text-secondary mb-2 font-mono">
							{{ target()!.currentAmount | currency: currency() }} /
							{{ target()!.targetAmount | currency: currency() }}
						</div>
						<div class="text-sm text-secondary">Deadline: {{ target()!.deadline | date }}</div>
					</div>
				</div>
			} @else {
				<div class="flex items-center justify-center h-full">
					<div class="flex flex-col items-center gap-4 text-stone-400">
						<p-knob
							value="0"
							[disabled]="true"
							valueTemplate="{value}%"
							[size]="150"
							valueColor="#42A5F5"
							rangeColor="var(--p-surface-200)"
						/>
						No target set
					</div>
				</div>
			}
		</div>
	</div>
</p-card>
