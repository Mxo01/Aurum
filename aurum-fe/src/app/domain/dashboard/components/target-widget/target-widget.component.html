<p-card class="rounded-xl flex flex-col h-full p-2">
	<div class="w-full flex flex-wrap justify-between items-center gap-3 mb-4">
		<span class="text-xl font-bold flex items-center gap-3 whitespace-nowrap">
			<i class="pi pi-gauge text-xl! font-bold"></i>
			Financial Target
		</span>
		<div class="flex gap-2">
			<p-splitbutton
				[label]="activeTarget() ? 'Edit' : 'Set Target'"
				severity="secondary"
				size="small"
				(onClick)="activeTarget() ? onEditTarget(activeTarget()!) : onAddTarget()"
				[model]="splitButtonItems()"
			/>
		</div>
	</div>

	<div class="grow flex flex-col items-center justify-center">
		@if (activeTarget()) {
			<div class="flex flex-col items-center gap-4">
				<p-knob
					[ngModel]="activeTarget()?.completionPercentage || 0 | number: '1.0-0'"
					[readonly]="true"
					valueTemplate="{value}%"
					[size]="150"
					valueColor="#ffffff"
					rangeColor="#454545"
				/>

				<div class="text-center">
					<div class="text-2xl font-bold mb-1">{{ activeTarget()!.name }}</div>
					<div class="text-secondary mb-2 font-mono">
						{{ activeTarget()!.currentAmount | currency: currency() }} /
						{{ activeTarget()!.targetAmount | currency: currency() }}
					</div>
					<div class="text-sm text-gray-400">Deadline: {{ activeTarget()!.deadline | date }}</div>
				</div>
			</div>
		} @else {
			<div class="flex items-center justify-center h-full">
				<div class="flex flex-col items-center gap-4 text-stone-400">
					<p-knob
						value="0"
						[disabled]="true"
						valueTemplate="{value}%"
						[size]="150"
						valueColor="#ffffff"
						rangeColor="#454545"
					/>
					No target set
				</div>
			</div>
		}
	</div>
</p-card>

<app-target-form
	[(isVisible)]="isFormVisible"
	[(selectedTarget)]="selectedTarget"
	[currency]="currency()"
	(save)="onSaveTarget($event)"
/>

<app-target-list
	[(isVisible)]="isListVisible"
	[targets]="targets()"
	[currency]="currency()"
	(edit)="onEditTarget($event)"
	(delete)="onDeleteTarget($event)"
/>
