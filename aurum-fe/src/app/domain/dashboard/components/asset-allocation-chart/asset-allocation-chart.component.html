<div class="flex flex-col gap-3">
	<span class="text-xl font-bold flex items-center gap-3 whitespace-nowrap mb-4">
		<i class="pi pi-chart-pie text-xl! font-bold"></i>
		Asset Allocation
	</span>
	@if (meterItems().length) {
		<p-metergroup [value]="meterItems()" />
	} @else {
		<div class="flex flex-col items-center gap-4 text-stone-400">
			<i class="pi pi-chart-pie text-4xl!"></i>
			Not enough data.
		</div>
	}
</div>
