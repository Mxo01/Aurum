<p-card class="rounded-xl h-full flex flex-col">
	<div class="flex flex-col h-full p-6">
		<span class="text-xl font-bold mb-4 flex items-center gap-3">
			<i class="pi pi-sitemap text-xl! font-bold"></i>
			Asset Allocation
		</span>
		<div class="grow min-h-0 flex items-center justify-center">
			@if (assetAllocationChartData()?.labels?.length) {
				<p-chart
					type="pie"
					[data]="assetAllocationChartData()"
					[options]="chartOptions"
				/>
			} @else {
				<div class="flex flex-col items-center gap-4 text-stone-400">
					<i class="pi pi-chart-pie text-4xl!"></i>
					Not enough data to display a chart.
				</div>
			}
		</div>
	</div>
</p-card>
