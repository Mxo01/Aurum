<div
	class="p-5 rounded-2xl border border-zinc-200/80 dark:border-zinc-800 bg-white/60 dark:bg-zinc-900/60 backdrop-blur-sm h-full flex flex-col gap-5"
>
	<div class="flex flex-wrap justify-between items-center gap-3">
		<span
			class="text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400 flex items-center gap-2 whitespace-nowrap"
		>
			<i class="pi pi-wallet"></i>
			Top Assets
		</span>
		<p-button
			label="View more"
			size="small"
			severity="secondary"
			[text]="true"
			iconPos="right"
			icon="pi pi-arrow-right"
			class="whitespace-nowrap"
			(onClick)="viewMore.emit()"
		/>
	</div>

	<div class="flex flex-col gap-5">
		<p-table
			[value]="assetsWithBalance()"
			[rows]="5"
		>
			<ng-template #header>
				<tr class="bg-transparent!">
					<th class="bg-transparent! tracking-wider text-sm uppercase">Name</th>
					<th class="bg-transparent! tracking-wider text-sm uppercase">Current Value</th>
					<th class="bg-transparent! tracking-wider text-sm uppercase">Variation (1M)</th>
				</tr>
			</ng-template>
			<ng-template
				#body
				let-asset
			>
				<tr class="bg-transparent!">
					<td>
						<span class="uppercase tracking-wider">{{ asset.name }}</span>
					</td>
					<td class="font-mono font-bold tabular-nums">
						{{
							asset.currentValueBase | privacyCurrency: currency() : "symbol" : "1.2-2" : locale()
						}}
					</td>
					<td>
						@if (asset.trend !== null) {
							<span
								class="whitespace-nowrap text-sm font-medium font-mono"
								[class]="
									(asset.type === AssetType.ASSET ? asset.trend >= 0 : asset.trend < 0)
										? 'text-green-500'
										: 'text-red-500'
								"
							>
								<i
									[class]="asset.trend >= 0 ? 'pi pi-arrow-up' : 'pi pi-arrow-down'"
									class="text-xs!"
								></i>
								{{ asset.trendPercentage | number: "1.2-2" : locale() }}%
							</span>
						} @else {
							<span class="text-zinc-400 dark:text-zinc-500 italic text-xs">No data</span>
						}
					</td>
				</tr>
			</ng-template>
			<ng-template #emptymessage>
				<tr>
					<td
						colspan="5"
						class="text-center py-12!"
					>
						<div class="flex flex-col items-center gap-3 text-zinc-400 dark:text-zinc-500">
							<i class="pi pi-inbox text-4xl!"></i>
							<span class="text-sm">No assets found.</span>
						</div>
					</td>
				</tr>
			</ng-template>
		</p-table>

		<p-divider />

		<app-asset-allocation-chart [summary]="summary()" />
	</div>
</div>
