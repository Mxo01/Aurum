<p-card class="rounded-xl h-full flex flex-col p-2">
	<div class="flex flex-wrap justify-between items-center gap-3 mb-4">
		<span class="text-xl font-bold flex items-center gap-3 whitespace-nowrap">
			<i class="pi pi-wallet text-xl! font-bold"></i>
			Top Assets
		</span>
		<p-button
			label="View more"
			size="small"
			severity="secondary"
			iconPos="right"
			icon="pi pi-external-link"
			class="whitespace-nowrap"
			(onClick)="viewMore.emit()"
		/>
	</div>

	<div class="grow min-h-0">
		<p-table
			[value]="assetsWithBalance()"
			[rows]="5"
		>
			<ng-template #header>
				<tr>
					<th>Name</th>
					<th>Current Value</th>
					<th>Variation (1M)</th>
				</tr>
			</ng-template>
			<ng-template
				#body
				let-asset
			>
				<tr>
					<td>
						<div class="flex flex-column">
							<span class="font-medium flex items-center gap-3">
								<p-tag
									class="whitespace-nowrap"
									[value]="asset.type === AssetType.ASSET ? 'Asset' : 'Liability'"
									[severity]="asset.type === AssetType.ASSET ? 'info' : 'warn'"
									[icon]="asset.type === AssetType.ASSET ? 'pi pi-wallet' : 'pi pi-shield'"
									[rounded]="true"
								/>
								{{ asset.name }}
							</span>
						</div>
					</td>
					<td class="font-mono">
						{{ asset.currentValue | currency: asset.originalCurrency }}
					</td>
					<td>
						@if (asset.trend !== null) {
							<span
								class="whitespace-nowrap"
								[class]="asset.trend >= 0 ? 'text-green-500' : 'text-red-500'"
							>
								<i
									[class]="asset.trend >= 0 ? 'pi pi-arrow-up' : 'pi pi-arrow-down'"
									class="text-sm"
								></i>
								{{ asset.trendPercentage | number: "1.2-2" }}%
							</span>
						} @else {
							<span class="text-stone-400 italic text-xs">No data</span>
						}
					</td>
				</tr>
			</ng-template>
			<ng-template #emptymessage>
				<tr>
					<td
						colspan="5"
						class="text-center py-12!"
					>
						<div class="flex flex-col items-center gap-4 text-stone-400">
							<i class="pi pi-inbox text-4xl!"></i>
							<p>No assets found.</p>
						</div>
					</td>
				</tr>
			</ng-template>
		</p-table>
	</div>
</p-card>
