<div
	class="h-full p-5 rounded-2xl border border-zinc-200/80 dark:border-zinc-800 bg-white/60 dark:bg-zinc-900/60 backdrop-blur-sm flex flex-col gap-2"
>
	<span class="text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
		{{ label() }}
	</span>
	<div class="flex items-center justify-between gap-2">
		<span class="text-2xl font-bold font-mono tracking-tight">{{ value() }}</span>
		@if (sparklineData() && sparklineData()!.length > 1) {
			<div class="w-20 h-9">
				<p-chart
					type="line"
					[data]="sparklineChartData()"
					[options]="sparklineOptions"
				/>
			</div>
		} @else if (variation()) {
			<span
				[class]="isPositive() ? 'text-green-500' : 'text-red-500'"
				class="text-sm font-semibold tabular-nums"
			>
				{{ variation()! > 0 ? "+" : "" }}{{ variation() }}%
			</span>
		}
	</div>
	@if (subtext()) {
		<span class="text-xs text-zinc-400 dark:text-zinc-500">{{ subtext() }}</span>
	}
</div>
