<div
	class="p-5 rounded-2xl border border-zinc-200/80 dark:border-zinc-800 bg-white/60 dark:bg-zinc-900/60 backdrop-blur-sm"
>
	<div class="flex items-center justify-between mb-4">
		<span class="text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
			Monthly Overview
		</span>
		<div class="flex items-center gap-4 text-xs text-zinc-400 dark:text-zinc-500">
			<span class="flex items-center gap-1.5">
				<span
					class="inline-block w-3 h-3 rounded-full"
					style="background: #748cab"
				></span>
				Earned
			</span>
			<span class="flex items-center gap-1.5">
				<span
					class="inline-block w-3 h-3 rounded-full"
					style="background: #1d2d44"
				></span>
				Spent
			</span>
		</div>
	</div>
	@if (isLoading()) {
		<p-skeleton height="220px" />
	} @else if (isChartEmpty()) {
		<div class="flex flex-col items-center gap-4 text-zinc-400 dark:text-zinc-500 py-11">
			<i class="pi pi-chart-bar text-4xl!"></i>
			<p>No cash flow data yet. Click any cell to start tracking.</p>
		</div>
	} @else {
		<p-chart
			type="bar"
			[data]="chartData()"
			[options]="chartOptions()"
			[plugins]="chartPlugins()"
			height="220px"
		/>
	}
</div>
