<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Aurum</title>
		<base href="/" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<!-- Primary SEO -->
		<meta
			name="description"
			content="Aurum is a personal wealth management app. Track assets, monitor net worth over time, set financial targets, and get multi-currency analytics — all in one place."
		/>
		<meta
			name="robots"
			content="index, follow"
		/>
		<link
			rel="canonical"
			href="https://aurum-networth.com/"
		/>

		<!-- Open Graph -->
		<meta
			property="og:type"
			content="website"
		/>
		<meta
			property="og:url"
			content="https://aurum-networth.com/"
		/>
		<meta
			property="og:title"
			content="Aurum"
		/>
		<meta
			property="og:description"
			content="Track assets, monitor net worth over time, set financial targets, and get multi-currency analytics — all in one place."
		/>
		<meta
			property="og:image"
			content="https://aurum-networth.com/og-image.png"
		/>
		<meta
			property="og:site_name"
			content="Aurum"
		/>
		<meta
			property="og:locale"
			content="en_US"
		/>

		<!-- Twitter Card -->
		<meta
			name="twitter:card"
			content="summary_large_image"
		/>
		<meta
			name="twitter:title"
			content="Aurum"
		/>
		<meta
			name="twitter:description"
			content="Track assets, monitor net worth over time, set financial targets, and get multi-currency analytics."
		/>
		<meta
			name="twitter:image"
			content="https://aurum-networth.com/og-image.png"
		/>

		<!-- JSON-LD Structured Data -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Aurum",
				"url": "https://aurum-networth.com",
				"description": "Personal wealth management app. Track assets, net worth, and financial targets with multi-currency support.",
				"applicationCategory": "FinanceApplication",
				"operatingSystem": "Web",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				}
			}
		</script>

		<!-- Favicon -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="favicon.svg"
		/>

		<!-- Google Fonts -->
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
