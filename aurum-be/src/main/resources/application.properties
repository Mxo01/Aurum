spring.application.name=aurum-be
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}
auth0.management.domain=${AUTH0_MANAGEMENT_DOMAIN}
auth0.management.clientId=${AUTH0_MANAGEMENT_CLIENT_ID}
auth0.management.clientSecret=${AUTH0_MANAGEMENT_CLIENT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
spring.ai.mcp.server.name=aurum-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STATELESS
mcp.resource-url=${MCP_RESOURCE_URL:https://api.aurum-networth.com/mcp}
mcp.audience=${MCP_AUDIENCE:}
mcp.scopes.read=${MCP_READ_SCOPES:}
mcp.scopes.write=${MCP_WRITE_SCOPES:}
mcp.allowed-origins=${MCP_ALLOWED_ORIGINS:}
mcp.max-batch-size=${MCP_MAX_BATCH_SIZE:500}


# Emit OpenAPI 3.0.1 so `nullable` is expressed the way codegen tools expect
springdoc.api-docs.version=openapi_3_0
