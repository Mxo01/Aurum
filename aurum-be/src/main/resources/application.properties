spring.application.name=aurum-be
spring.datasource.url=jdbc:postgresql://localhost:5432/aurum
spring.datasource.username=user
spring.datasource.password=password
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Auth0 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://aurum-api.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://api.aurum.com
