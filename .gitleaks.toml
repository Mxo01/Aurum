# Configurazione gitleaks per Aurum.
# Estende il ruleset di default e aggiunge una allowlist per i falsi positivi noti.
# NB: gitleaks usa RE2 (Go) — niente lookahead/lookbehind nelle regex.

[extend]
useDefault = true

[[rules]]
id = "auth0-management-client-secret"
description = "Auth0 Management API client secret hardcoded in un properties file"
# I placeholder ${VAR} non matchano: dopo l'= servirebbe un char di [A-Za-z0-9_-], ma c'e' '$'
# [ \t] e non \s intorno all'=, o una property vuota si prende il valore della riga dopo.
regex = '''(?i)auth0\.management\.clientSecret[ \t]*=[ \t]*([A-Za-z0-9_\-]{20,})'''
# Senza secretGroup gitleaks redige il match intero: nel report finirebbe
# "auth0.management.clientREDACTED=<valore in chiaro>".
secretGroup = 1
tags = ["auth0", "secret"]

[[rules]]
id = "spring-property-hardcoded-secret"
description = "Proprieta' Spring con secret/password hardcoded invece di ${ENV_VAR}"
# [^\s$] come primo char del valore esclude i placeholder ${...} e i valori vuoti.
# [ \t] e non \s intorno all'=: con \s una property lasciata vuota matchava il
# valore della riga successiva, segnalando la property sbagliata.
regex = '''(?im)^[ \t]*[a-z0-9._-]*(?:secret|password|api[._-]?key|token)[ \t]*=[ \t]*([^\s$][^\s]{11,})'''
secretGroup = 1
path = '''\.properties$'''
tags = ["spring", "secret"]

[allowlist]
description = "Falsi positivi noti"

# Il client secret di gestione Auth0 committato in f2d8c4a (marzo 2026) e'
# stato ruotato: il valore nella history non e' piu' valido. La history non si
# riscrive (invaliderebbe ogni clone e ogni PR aperta senza aggiungere
# sicurezza, perche' il valore e' gia' pubblico e i fork lo conservano), quindi
# si esclude quel commit. L'esclusione e' per commit, non per path: un secret
# nuovo nello stesso file viene comunque segnalato.
commits = [
  "f2d8c4a5a0a2a32f13dcbbf887bc8494af3d5b52",
]

paths = [
  # Client ID della SPA: pubblico per design, viaggia nel bundle JS servito al browser
  '''aurum-fe/src/environments/environment.*\.ts$''',
  # Template senza valori reali
  '''application-local\.properties\.example$''',
  # Fixture con una credenziale finta: solo i file che la contengono, non tutti i test
  '''aurum-be/src/test/java/com/backend/aurum/domain/auth/service/Auth0ManagementServiceTest\.java$''',
  '''aurum-be/src/test/java/com/backend/aurum/domain/mcp/controller/ApiKeyControllerTest\.java$''',
  '''aurum-be/src/test/java/com/backend/aurum/domain/mcp/service/ApiKeyServiceTest\.java$''',
]

regexes = [
  # I default del PostgreSQL locale di compose.yaml, non sono credenziali di produzione
  '''spring\.datasource\.(username|password)=(user|password)''',
]
